<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Combinations Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Cinzel', serif;
    color: #f2e6c9;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-image: url('images/Back1.png');
    background-size: cover;
    background-position: center;
  }

.vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      /* above everything else */
      pointer-events: none;
      /* clicks pass through */
      background: linear-gradient(
          /* top to bottom */
          180deg,
          rgba(0, 0, 0, 0.6) 0%,
          rgba(0, 0, 0, 0.1) 10%,
          rgba(0, 0, 0, 0) 20%),
        linear-gradient(
          /*bottom to top */
          0deg,
          rgba(0, 0, 0, 0.6) 0%,
          rgba(0, 0, 0, 0.1) 10%,
          rgba(0, 0, 0, 0) 20%);

    }
  /* ---------- HEADER ---------- */
  #header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 40px;
  }
  .nav-label {
    font-size: 16px;
    letter-spacing: 2px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 1px solid #d8c48f;
    padding-bottom: 4px;
    color: #f2e6c9;
  }

  /* ---------- BODY LAYOUT ---------- */
  #body {
    flex: 1;
    display: flex;
    padding: 10px 40px 40px 40px;
    gap: 30px;
    overflow: hidden;
    min-height: 0;
  }

  /* ---------- LEFT PANEL ---------- */
  #left-panel {
    width: 42%;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  #challenge-title {
    font-size: 24px;
    margin: 0 0 10px 0;
    font-weight: 700;
  }
  #description {
    font-family: 'Segoe UI', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #f2e6c9;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* ---------- TERMINAL ---------- */
  #terminal {
    background: rgba(40, 30, 34, 0.55);
    border-radius: 8px;
    padding: 14px 16px;
    min-height: 200px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 15px;
    position: relative;
    backdrop-filter: blur(2px);
  }
  #run-btn {
    position: absolute;
    top: 12px;
    right: 14px;
    background: rgba(216,196,143,0.85);
    color: #3a232b;
    border: none;
    border-radius: 5px;
    padding: 5px 16px;
    font-family: 'Segoe UI', sans-serif;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
  }
  #run-btn:hover { background: #e8d9b0; }

  #code-lines { margin-top: 34px; line-height: 26px; }
  .code-line { white-space: pre; }
  .property { color: #9fce6a; }
  .punct { color: #d4d4d4; }
  .input-label {
    font-family: 'Segoe UI', sans-serif;
    font-size: 12px;
    color: #cbb98a;
    margin-right: 8px;
    display: inline-block;
    width: 60px;
  }

  .css-input {
    background: rgba(255,255,255,0.08);
    border: none;
    border-radius: 3px;
    color: #f2e6c9;
    font-family: inherit;
    font-size: 15px;
    padding: 2px 8px;
    outline: none;
    width: 100%;
    max-width: 260px;
    margin-bottom: 4px;
  }
  .css-input::placeholder { color: #cbb98a; }

  #feedback {
    font-family: 'Segoe UI', sans-serif;
    font-size: 13px;
    font-weight: 600;
    margin-top: 12px;
  }
  #feedback.success { color: #7ec97e; }
  #feedback.fail { color: #e08a7d; }

  #footer {
    display: flex;
    justify-content: space-between;
    padding: 0 40px 30px 40px;
  }
  .nav-btn {
    background: none;
    border: none;
    color: #f2e6c9;
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    border-bottom: 1px solid #d8c48f;
    padding-bottom: 3px;
  }
  .nav-btn:disabled { opacity: 0.3; cursor: default; border-bottom-color: transparent; }
  .nav-btn:hover:not(:disabled) { color: #ffe9b0; }

  /* ---------- RIGHT PANEL: FLEX PLAYGROUND ---------- */
  #flex-playground {
    flex: 1;
    background-image: url('images/playground.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    position: relative;
  }
  #targets-layer { position: absolute; inset: 0; }
  .target-img {
    position: absolute;
    width: 50px;
    height: auto;
    opacity: 0.9;
    transform: translate(-50%, -50%);
  }
  #flex-container {
    position: absolute;
    inset: 0;
    display: flex;
    padding: 50px;
  }
  .knight-img {
    width: 50px;
    height: auto;
    flex-shrink: 0;
    transition: all 0.4s ease;
  }

  /* ---------- RIGHT PANEL: GRID PLAYGROUND ---------- */
  #grid-playground-frame {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(60, 45, 40, 0.35);
    border: 6px solid #7a5a3a;
    border-radius: 10px;
    box-shadow: inset 0 0 0 2px rgba(216,196,143,0.4);
  }
  #grid-playground {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 100%;
    max-width: 480px;
    aspect-ratio: 4 / 3;
  }
  .tile {
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(90, 65, 40, 0.6);
  }
</style>
</head>
<body>

  <div id="header">
    <div class="nav-label">Lesson</div>
    <div class="nav-label">Map</div>
  </div>
  <div class="vignette"></div>

  <div id="body">
    <div id="left-panel">
      <h1 id="challenge-title">Challenge 1</h1>
      <div id="description"></div>

      <div id="terminal">
        <button id="run-btn" onclick="runCheck()">Run</button>
        <div id="code-lines">
          <div class="code-line"><span class="property">#field</span><span class="punct">{</span></div>
          <div class="code-line"><span class="punct">/* Type your answer */</span></div>
          <div id="inputs-area"></div>
          <div class="code-line"><span class="punct">}</span></div>
        </div>
        <div id="feedback"></div>
      </div>
    </div>

    <div id="flex-playground" style="display:none;">
      <div id="targets-layer"></div>
      <div id="flex-container"></div>
    </div>

    <div id="grid-playground-frame" style="display:none;">
      <div id="grid-playground"></div>
    </div>
  </div>

  <div id="footer">
    <button class="nav-btn" id="back-btn" onclick="prevLevel()">Back</button>
    <button class="nav-btn" id="next-btn" onclick="nextLevel()">Next</button>
  </div>

<script>
const COLS = 4;
const ROWS = 3;

const levels = [
  // ---------- FLEXBOX CHALLENGES ----------
  {
    type: "flex",
    title: "Challenge 1",
    description: "Stack the knights into a column and bring them to the vertical center using flex-direction and justify-content.",
    knightCount: 3,
    inputs: [{ id: "a", label: "" }],
    check: (vals) => /flex-direction\s*:\s*column/.test(vals.a) && /justify-content\s*:\s*center/.test(vals.a),
    apply: { flexDirection: "column", justifyContent: "center" }
  },
  {
    type: "flex",
    title: "Challenge 2",
    description: "Too many knights for one line. Wrap them into rows, spaced to the full width, using flex-wrap and justify-content.",
    knightCount: 8,
    inputs: [{ id: "a", label: "" }],
    check: (vals) => /flex-wrap\s*:\s*wrap/.test(vals.a) && /justify-content\s*:\s*space-between/.test(vals.a),
    apply: { flexWrap: "wrap", justifyContent: "space-between" },
    extraContainerStyle: { width: "80%" }
  },
  {
    type: "flex",
    title: "Challenge 3",
    description: "Bring everything together — wrap the knights, center them vertically, and space them evenly, using flex-wrap, align-items, and justify-content.",
    knightCount: 9,
    inputs: [{ id: "a", label: "" }],
    check: (vals) => /flex-wrap\s*:\s*wrap/.test(vals.a) && /align-items\s*:\s*center/.test(vals.a) && /justify-content\s*:\s*space-around/.test(vals.a),
    apply: { flexWrap: "wrap", alignItems: "center", justifyContent: "space-around" },
    extraContainerStyle: { width: "80%" }
  },

  // ---------- GRID CHALLENGES ----------
  {
    type: "grid",
    title: "Challenge 4",
    description: "The weapon rack stretches wide, resting low. Reach it using grid-column and grid-row.",
    knightStart: { col: 1, row: 1 },
    targetCells: [{ col: 2, row: 3 }, { col: 3, row: 3 }, { col: 4, row: 3 }],
    inputs: [{ id: "a", label: "" }],
    check: (vals) => /grid-column\s*:\s*2\s*\/\s*5\s*;?/.test(vals.a) && /grid-row\s*:\s*3\s*;?/.test(vals.a),
    apply: { gridColumn: "2 / 5", gridRow: "3" }
  },
  {
    type: "grid",
    title: "Challenge 5",
    description: "The rack is wide and tall, but not a perfect square. Match its shape using grid-column and grid-row spans.",
    knightStart: { col: 1, row: 3 },
    targetCells: [
      { col: 2, row: 1 }, { col: 3, row: 1 }, { col: 4, row: 1 },
      { col: 2, row: 2 }, { col: 3, row: 2 }, { col: 4, row: 2 }
    ],
    inputs: [{ id: "a", label: "" }],
    check: (vals) => /grid-column\s*:\s*2\s*\/\s*5\s*;?/.test(vals.a) && /grid-row\s*:\s*1\s*\/\s*3\s*;?/.test(vals.a),
    apply: { gridColumn: "2 / 5", gridRow: "1 / 3" }
  },
  {
    type: "grid",
    title: "Challenge 6",
    description: "Two knights, two weapons. Place the first knight using grid-column and grid-row, then place the second knight the same way.",
    knightStarts: [{ col: 1, row: 1 }, { col: 1, row: 2 }],
    targetSets: [
      [{ col: 3, row: 1 }],
      [{ col: 2, row: 3 }, { col: 3, row: 3 }, { col: 4, row: 3 }]
    ],
    inputs: [
      { id: "a", label: "Knight A" },
      { id: "b", label: "Knight B" }
    ],
    check: (vals) =>
      /grid-column\s*:\s*3\s*;?/.test(vals.a) && /grid-row\s*:\s*1\s*;?/.test(vals.a) &&
      /grid-column\s*:\s*2\s*\/\s*5\s*;?/.test(vals.b) && /grid-row\s*:\s*3\s*;?/.test(vals.b),
    applySets: [
      { gridColumn: "3", gridRow: "1" },
      { gridColumn: "2 / 5", gridRow: "3" }
    ]
  }
];

let current = 0;

/* ---------- SHARED ---------- */
function loadLevel() {
  const lvl = levels[current];
  document.getElementById("challenge-title").textContent = lvl.title;
  document.getElementById("description").textContent = lvl.description;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "";
  document.getElementById("back-btn").disabled = current === 0;

  // Next / Get Certificate button logic
  const nextBtn = document.getElementById("next-btn");
  if (current === levels.length - 1) {
    nextBtn.textContent = "Get Certificate";
    nextBtn.disabled = false;
    nextBtn.onclick = goToCompletion;
  } else {
    nextBtn.textContent = "Next";
    nextBtn.disabled = false;
    nextBtn.onclick = nextLevel;
  }

  // build input fields dynamically
  const inputsArea = document.getElementById("inputs-area");
  inputsArea.innerHTML = "";
  lvl.inputs.forEach(inp => {
    const line = document.createElement("div");
    line.className = "code-line";
    if (inp.label) {
      const label = document.createElement("span");
      label.className = "input-label";
      label.textContent = inp.label + ":";
      line.appendChild(label);
    }
    const input = document.createElement("input");
    input.type = "text";
    input.className = "css-input";
    input.id = "input-" + inp.id;
    line.appendChild(input);
    inputsArea.appendChild(line);
  });

  document.getElementById("flex-playground").style.display = lvl.type === "flex" ? "block" : "none";
  document.getElementById("grid-playground-frame").style.display = lvl.type === "grid" ? "flex" : "none";

  if (lvl.type === "flex") {
    loadFlexLevel(lvl);
  } else {
    loadGridLevel(lvl);
  }
}

function goToCompletion() {
  window.location.href = "completion.html";
}
/* ---------- FLEX PLAYGROUND ---------- */
function loadFlexLevel(lvl) {
  const playground = document.getElementById("flex-playground");
  const container = document.getElementById("flex-container");

  container.removeAttribute("style");
  container.style.position = "absolute";
  container.style.inset = "0";
  container.style.display = "flex";
  container.style.padding = "50px";
  if (lvl.extraContainerStyle) Object.assign(container.style, lvl.extraContainerStyle);
  container.innerHTML = "";
  for (let i = 0; i < lvl.knightCount; i++) {
    const img = document.createElement("img");
    img.src = "images/knight.svg";
    img.className = "knight-img";
    container.appendChild(img);
  }

  const ghost = container.cloneNode(true);
  ghost.style.visibility = "hidden";
  ghost.style.pointerEvents = "none";
  Object.assign(ghost.style, lvl.apply);
  playground.appendChild(ghost);

  const playgroundRect = playground.getBoundingClientRect();
  const ghostItems = ghost.querySelectorAll(".knight-img");

  const targetsLayer = document.getElementById("targets-layer");
  targetsLayer.innerHTML = "";
  ghostItems.forEach(item => {
    const r = item.getBoundingClientRect();
    const img = document.createElement("img");
    img.src = "images/axe.svg";
    img.className = "target-img";
    img.style.left = (r.left - playgroundRect.left + r.width / 2) + "px";
    img.style.top = (r.top - playgroundRect.top + r.height / 2) + "px";
    targetsLayer.appendChild(img);
  });

  playground.removeChild(ghost);
}

/* ---------- GRID PLAYGROUND ---------- */
function cellKey(col, row) { return row + "-" + col; }

function buildGrid() {
  const playground = document.getElementById("grid-playground");
  playground.innerHTML = "";
  for (let row = 1; row <= ROWS; row++) {
    for (let col = 1; col <= COLS; col++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.dataset.key = cellKey(col, row);
      tile.style.backgroundImage = "url('images/plain_tile.svg')";
      playground.appendChild(tile);
    }
  }
}
function getTile(col, row) {
  return document.querySelector('.tile[data-key="' + cellKey(col, row) + '"]');
}

function loadGridLevel(lvl) {
  buildGrid();

  if (lvl.knightStarts) {
    // multi-knight level (challenge 6)
    lvl.knightStarts.forEach((start, i) => {
      const t = getTile(start.col, start.row);
      t.style.backgroundImage = "url('images/knight_tile.svg')";
    });
    lvl.targetSets.forEach(set => {
      set.forEach(c => {
        const t = getTile(c.col, c.row);
        if (t.style.backgroundImage.indexOf("knight_tile") === -1) {
          t.style.backgroundImage = "url('images/axe_tile.svg')";
        }
      });
    });
  } else {
    const startTile = getTile(lvl.knightStart.col, lvl.knightStart.row);
    startTile.style.backgroundImage = "url('images/knight_tile.svg')";
    lvl.targetCells.forEach(c => {
      const t = getTile(c.col, c.row);
      if (t !== startTile) t.style.backgroundImage = "url('images/axe_tile.svg')";
    });
  }
}

function parseSpan(value, axisSize) {
  value = value.trim();
  let start, end;
  if (value.includes("/")) {
    const parts = value.split("/").map(s => parseInt(s.trim(), 10));
    start = parts[0]; end = parts[1];
  } else {
    start = parseInt(value, 10); end = start + 1;
  }
  const cells = [];
  for (let i = start; i < end; i++) cells.push(i);
  return cells;
}

/* ---------- NAV ---------- */
function prevLevel() { if (current > 0) { current--; loadLevel(); } }
function nextLevel() { if (current < levels.length - 1) { current++; loadLevel(); } }

/* ---------- CHECK ---------- */
function runCheck() {
  const lvl = levels[current];
  const vals = {};
  lvl.inputs.forEach(inp => {
    vals[inp.id] = document.getElementById("input-" + inp.id).value;
  });
  const feedback = document.getElementById("feedback");

  if (lvl.check(vals)) {
    if (lvl.type === "flex") {
      const container = document.getElementById("flex-container");
      Object.assign(container.style, lvl.apply);
    } else {
      buildGrid();
      if (lvl.applySets) {
        lvl.knightStarts.forEach((start, i) => {
          const cols = parseSpan(lvl.applySets[i].gridColumn, COLS);
          const rows = parseSpan(lvl.applySets[i].gridRow, ROWS);
          rows.forEach(r => cols.forEach(c => {
            const t = getTile(c, r);
            if (t) t.style.backgroundImage = "url('images/knight_tile.svg')";
          }));
        });
      } else {
        const cols = parseSpan(lvl.apply.gridColumn, COLS);
        const rows = parseSpan(lvl.apply.gridRow, ROWS);
        rows.forEach(r => cols.forEach(c => {
          const t = getTile(c, r);
          if (t) t.style.backgroundImage = "url('images/knight_tile.svg')";
        }));
      }
    }
    feedback.textContent = "✔ Correct! The knights find their weapons.";
    feedback.className = "success";
  } else {
    feedback.textContent = "✘ Not quite. Try again.";
    feedback.className = "fail";
  }
}

loadLevel();
</script>

</body>
</html>
