<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Codyssey - Register</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/registration.css">
  <link rel="stylesheet" href="css/style.css">
<script src="js/registration.js" defer></script>
<script src="js/script.js" defer></script>
</head>
<body>
   <div class="darken-overlay"></div>
  <div class="parallax-container">
    <div class="vignette"></div>
     <img class="sky" src="/images/Back_layer.png">  
    <img class="cloud-1" src="/images/Cloud1.svg">  
   <img class="cloud-2" src="/images/Cloud2.svg">  
   <img class="cloud-3" src="/images/Cloud3.svg"> 
   <img class="mountain" src="/images/mountain.svg"> 
   <img class="sea" src="/images/sea.svg"> 
   <img class="ship" src="/images/ship.svg">
   <img class="man" src="/images/man.svg">  
    <img class="wind1" src="/images/wind.svg">     
    <img class="wind2" src="/images/wind.svg">     
    <img class="wind3" src="/images/wind.svg">   
    
  <div class="page">

    <div class="card">
      <div class="card-content">
        <h2 class="card-title">Register</h2>

        <form class="register-form">
          <input type="email" name="email" placeholder="Email" >
          <input type="text" name="username" placeholder="Username" >
          <input type="password" name="password" placeholder="Password" >
          <input type="password" name="confirm-password" placeholder="Confirm password" >

          <p class="signin-line">Already have an account? <a href="#">sign in</a></p>

<a href="map.html" class="register-btn">Register</a>        </form>
      </div>
    </div>
  </div>


</body>
</html>
